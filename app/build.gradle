apply plugin: 'com.android.application'
apply plugin: "kotlin-android"
apply plugin: "kotlin-kapt"

kapt {
    correctErrorTypes true
}

android {
    namespace 'com.lastaurus.automatic_congratulations'
//    compileSdkVersion 34
//    buildToolsVersion '34.0.0'

    defaultConfig {
        applicationId "com.lastaurus.automatic_congratulations"
        minSdkVersion 26
        compileSdk 34
        targetSdkVersion 34
        resConfigs "ru"
        javaCompileOptions {
            annotationProcessorOptions {
                arguments += [
                        "room.schemaLocation"  : "$projectDir/schemas".toString(),
                        "room.incremental"     : "true",
                        "room.expandProjection": "true"]
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        viewBinding = true
        compose = true
    }

    composeOptions {
        kotlinCompilerExtensionVersion = "1.5.14"
    }

}
allprojects {
    repositories {
        maven { url "https://jitpack.io" }
    }
}
dependencies {

    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0-alpha13'
    implementation 'com.google.android.material:material:1.12.0'
    implementation "androidx.viewpager2:viewpager2:1.1.0"
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'

    //RX
    implementation 'io.reactivex.rxjava3:rxjava:3.1.6'
    implementation 'io.reactivex.rxjava3:rxandroid:3.0.2'

    //cicerone
    implementation("com.github.terrakok:cicerone:7.1")
    implementation 'androidx.compose.ui:ui-tooling-preview-android:1.6.8'

    //room
    def room_version = "2.6.1"

    implementation("androidx.room:room-runtime:$room_version")
    annotationProcessor("androidx.room:room-compiler:$room_version")
    kapt("androidx.room:room-compiler:$room_version")
    implementation("androidx.room:room-ktx:$room_version")
    implementation("androidx.room:room-rxjava2:$room_version")
    implementation("androidx.room:room-rxjava3:$room_version")
    implementation("androidx.room:room-guava:$room_version")
    implementation("androidx.room:room-paging:$room_version")


    //joda-time
    implementation 'joda-time:joda-time:2.12.5'
    annotationProcessor "android.arch.persistence.room:compiler:1.1.1"

    //Moxy
    def versionMoxy = "2.2.2"
    implementation "com.github.moxy-community:moxy:$versionMoxy"
    implementation "com.github.moxy-community:moxy-androidx:$versionMoxy"
    implementation "com.github.moxy-community:moxy-material:$versionMoxy"
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    annotationProcessor "com.github.moxy-community:moxy-compiler:$versionMoxy"
    kapt("com.github.moxy-community:moxy-compiler:$versionMoxy")

    //Dagger 2
    def versionDagger = '2.51'
    implementation "com.google.dagger:dagger:$versionDagger"
    annotationProcessor "com.google.dagger:dagger-compiler:$versionDagger"
    kapt("com.google.dagger:dagger-compiler:$versionDagger")

    //retrofit2
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'

    //Пикассо
    implementation 'com.squareup.picasso:picasso:2.71828'

    def versionLifecycle = "2.8.4"
    def versionWork = "2.9.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:$versionLifecycle"
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:$versionLifecycle"
    implementation "androidx.lifecycle:lifecycle-livedata-ktx:$versionLifecycle"
    implementation "androidx.work:work-runtime:$versionWork"
    implementation "androidx.work:work-runtime-ktx:$versionWork"
    implementation 'androidx.activity:activity-ktx:1.9.1'
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.fragment:fragment-ktx:1.8.2'


    def versionCoroutines = "1.6.4"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$versionCoroutines"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-core:$versionCoroutines"
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:$versionCoroutines"
    implementation project(path: ':ui')

    implementation "androidx.navigation:navigation-compose:2.7.7"
    implementation "io.coil-kt:coil-compose:2.7.0"

    def composeBom = platform('androidx.compose:compose-bom:2024.02.02')
    implementation composeBom
    androidTestImplementation composeBom
    // Choose one of the following:
    // Material Design 3
    implementation 'androidx.compose.material3:material3'
    // such as input and measurement/layout
    implementation 'androidx.compose.ui:ui'


    // Android Studio Preview support
    implementation 'androidx.compose.ui:ui-tooling-preview'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    // UI Tests
    androidTestImplementation 'androidx.compose.ui:ui-test-junit4'
    debugImplementation 'androidx.compose.ui:ui-test-manifest'

    // Optional - Included automatically by material, only add when you need
    // the icons but not the material library (e.g. when using Material3 or a
    // custom design system based on Foundation)
    implementation 'androidx.compose.material:material-icons-core'
    // Optional - Add full set of material icons
    implementation 'androidx.compose.material:material-icons-extended'
    // Optional - Add window size utils
    implementation 'androidx.compose.material3:material3-window-size-class'

    implementation("com.android.volley:volley:1.2.1")
    implementation("androidx.compose.ui:ui-graphics")

    // Optional - Integration with activities
    implementation 'androidx.activity:activity-compose:1.9.1'
    // Optional - Integration with ViewModels
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.4'
    // Optional - Integration with LiveData
    implementation 'androidx.compose.runtime:runtime-livedata'
    // Optional - Integration with RxJava
    implementation 'androidx.compose.runtime:runtime-rxjava2'
}